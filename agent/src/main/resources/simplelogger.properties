# How the agent writes its log.
#
# Read by slf4j-simple from the classpath at start-up. It lives here rather
# than in the launcher's -D flags so that every way of starting the agent gets
# the same log: the Windows service, the systemd unit, a support engineer
# running the jar by hand, and CI.
#
# Timestamps, because a log without them cannot be used for the thing an agent
# log is for. These files are read after the fact, by someone asking when a
# camera stopped, whether a restart came before or after a network change, or
# how long a scan took. Without a time on the line the only ordering available
# is "further down the file", and correlating with anything else - the console,
# CloudWatch, a customer saying "around four o'clock" - is guesswork. The
# wrapper log had them all along, which made the mismatch worse: two files side
# by side in the same directory, one of them answerable.
org.slf4j.simpleLogger.showDateTime=true

# Local time with the offset spelled out, e.g. 2026-08-29 23:47:02.481+05:30.
#
# Local because whoever reads this log first is usually at, or on the phone to,
# the site it came from, and "around four o'clock" is local. The offset because
# that reader is often not: an estate spans timezones, and a bare local time
# from an unknown one is not a time at all. Both together need no conversion in
# the common case and are unambiguous in the rest.
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSSXXX

# The rest is what the agent already printed, kept deliberately: the thread
# name distinguishes the MQTT worker from the supervisor, which is most of what
# tells a pushed instruction apart from a scheduled sweep.
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.defaultLogLevel=info

# The AWS SDK and CRT are conversational at anything below warn, and at debug
# they print a canonical request per signed call - which is what buried the
# agent's own lines the last time this was turned up to chase a fault.
org.slf4j.simpleLogger.log.software.amazon=warn
