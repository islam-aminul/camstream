# IEEE OUI prefixes for CCTV vendors, and how their devices name streams.
#
# Not the whole IEEE registry. That file is several megabytes of mostly
# irrelevance — printers, phones, network cards — and this agent ships to
# machines where size and start-up time matter. What is needed here is narrow:
# the vendors that make cameras and recorders, because the vendor decides which
# RTSP paths are worth trying and which channel scheme a recorder uses.
#
# An unlisted prefix is not a failure. It means the vendor is unknown and the
# generic path list is used, which is what happened for every device before
# this file existed.
#
# Format:
#   oui.<PREFIX>       = <vendor key>          six hex digits, no separators
#   vendor.<key>.name  = <display name>
#   vendor.<key>.paths = <comma-separated RTSP paths, main before sub>
#   vendor.<key>.nvr   = <main channel pattern>,<sub channel pattern>
#
# Channel patterns take a placeholder, which is what lets one line describe a
# recorder's whole numbering scheme:
#   {channel}        1, 2, 3 ...
#   {channel:02}     01, 02, 03 ...
#   {channel*100+1}  101, 201, 301 ...   (Hikvision main streams)
#   {channel*100+2}  102, 202, 302 ...   (Hikvision sub streams)

# --- Hikvision, and the many brands built on its hardware -------------------
oui.4419B6 = hikvision
oui.44A642 = hikvision
oui.BCAD28 = hikvision
oui.C056E3 = hikvision
oui.E0CA3C = hikvision
oui.28573B = hikvision
oui.ACCBD1 = hikvision
oui.18680B = hikvision
oui.54C415 = hikvision
oui.8CE748 = hikvision
vendor.hikvision.name  = Hikvision
vendor.hikvision.paths = /Streaming/Channels/101, /Streaming/Channels/102, /h264/ch1/main/av_stream, /h264/ch1/sub/av_stream
vendor.hikvision.nvr   = /Streaming/Channels/{channel*100+1}, /Streaming/Channels/{channel*100+2}

# --- Dahua, and its OEM lines ----------------------------------------------
oui.3C1A0D = dahua
oui.4C11BF = dahua
oui.9C14C8 = dahua
oui.E0509D = dahua
oui.14A78B = dahua
oui.08ED02 = dahua
oui.B41513 = dahua
vendor.dahua.name  = Dahua
vendor.dahua.paths = /cam/realmonitor?channel=1&subtype=0, /cam/realmonitor?channel=1&subtype=1
vendor.dahua.nvr   = /cam/realmonitor?channel={channel}&subtype=0, /cam/realmonitor?channel={channel}&subtype=1

# --- Axis -------------------------------------------------------------------
oui.00408C = axis
oui.ACCC8E = axis
oui.B8A44F = axis
vendor.axis.name  = Axis
vendor.axis.paths = /axis-media/media.amp, /axis-media/media.amp?resolution=640x480
vendor.axis.nvr   =

# --- Uniview ----------------------------------------------------------------
oui.489435 = uniview
oui.6C5C14 = uniview
vendor.uniview.name  = Uniview
vendor.uniview.paths = /media/video1, /media/video2, /unicast/c1/s0/live, /unicast/c1/s1/live
vendor.uniview.nvr   = /unicast/c{channel}/s0/live, /unicast/c{channel}/s1/live

# --- Hanwha / Samsung Techwin ----------------------------------------------
oui.001C84 = hanwha
oui.0009180 = hanwha
oui.E44CC7 = hanwha
vendor.hanwha.name  = Hanwha
vendor.hanwha.paths = /profile2/media.smp, /profile5/media.smp
vendor.hanwha.nvr   = /profile{channel}/media.smp,

# --- Vivotek ----------------------------------------------------------------
oui.0002D1 = vivotek
vendor.vivotek.name  = Vivotek
vendor.vivotek.paths = /live.sdp, /live2.sdp
vendor.vivotek.nvr   =

# --- Bosch ------------------------------------------------------------------
oui.00075F = bosch
oui.001C44 = bosch
vendor.bosch.name  = Bosch
vendor.bosch.paths = /rtsp_tunnel, /?h26x=4
vendor.bosch.nvr   =

# --- CP Plus (Dahua OEM, common in India) -----------------------------------
oui.D42122 = cpplus
vendor.cpplus.name  = CP Plus
vendor.cpplus.paths = /cam/realmonitor?channel=1&subtype=0, /cam/realmonitor?channel=1&subtype=1
vendor.cpplus.nvr   = /cam/realmonitor?channel={channel}&subtype=0, /cam/realmonitor?channel={channel}&subtype=1

# --- TP-Link / VIGI ---------------------------------------------------------
oui.003192 = tplink
oui.5C628B = tplink
vendor.tplink.name  = TP-Link
vendor.tplink.paths = /stream1, /stream2
vendor.tplink.nvr   =

# --- Reolink ----------------------------------------------------------------
oui.EC71DB = reolink
vendor.reolink.name  = Reolink
vendor.reolink.paths = /h264Preview_01_main, /h264Preview_01_sub
vendor.reolink.nvr   = /h264Preview_{channel:02}_main, /h264Preview_{channel:02}_sub
