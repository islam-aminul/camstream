name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No AWS credentials anywhere in this workflow: it builds, tests and installs,
# but never deploys. Deployment stays a deliberate act from a workstation.
permissions:
  contents: read

jobs:
  agent:
    name: Agent (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        working-directory: agent
        run: mvn -B --no-transfer-progress verify

      # Development happens on arm64, so this is the only place the jar is
      # proven to run on the architecture most customers will deploy to. The
      # AWS CRT native is loaded rather than merely present.
      - name: Load the AWS CRT native on this architecture
        run: |
          echo "runner architecture: $(uname -m)"
          cat > /tmp/CrtCheck.java <<'JAVA'
          import software.amazon.awssdk.crt.CRT;
          public class CrtCheck {
            public static void main(String[] args) {
              System.out.println("crt os identifier : " + CRT.getOSIdentifier());
              System.out.println("crt architecture  : " + CRT.getArchIdentifier());
              System.out.println("jvm architecture  : " + System.getProperty("os.arch"));
            }
          }
          JAVA
          javac -cp agent/target/camstream-agent.jar -d /tmp /tmp/CrtCheck.java
          java -cp "agent/target/camstream-agent.jar:/tmp" CrtCheck

      - name: Agent starts and reports usage
        run: |
          set +e
          output="$(java -jar agent/target/camstream-agent.jar 2>&1)"
          status=$?
          echo "$output"
          [ "$status" -eq 2 ] || { echo "expected exit 2, got $status" >&2; exit 1; }
          case "$output" in *"usage: camstream-agent"*) ;; *) echo "unexpected output" >&2; exit 1;; esac

      - uses: actions/upload-artifact@v4
        with:
          name: camstream-agent-jar
          path: agent/target/camstream-agent.jar
          retention-days: 7

  installer:
    name: Linux installer
    needs: agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Build the distributable bundles
        run: ./packaging/build-dist.sh

      # The installer had been syntax-checked but never run. This executes it
      # against a real systemd, which is the only way to catch a bad unit file,
      # a wrong permission or a broken preflight.
      - name: Run the installer
        run: |
          mkdir -p /tmp/unpack
          tar -xzf dist/camstream-agent-*-linux.tar.gz -C /tmp/unpack
          cat > /tmp/agent.yaml <<'YAML'
          tenantId: ci-tenant
          premisesId: ci-site
          deviceId: ci-agent
          region: ap-south-1
          bucket: example-bucket
          apiInvokeUrl: https://example.invalid
          iotDataEndpoint: example.invalid
          iotCredentialsEndpoint: example.invalid
          certificatePath: /var/lib/camstream/device.crt
          privateKeyPath: /var/lib/camstream/device.key
          discoveryEnabled: false
          cameras: []
          YAML

          # Stand in for what an operator downloads: archives shaped like a
          # Temurin JRE and a static ffmpeg release, put into dependencies/.
          # The installer must extract these and pin the agent to them, taking
          # nothing from PATH — which is the whole point, since sudo does not
          # inherit the runner's PATH anyway.
          mkdir -p /tmp/deps/ffmpeg-release-amd64-static
          # -h dereferences: setup-java puts a symlink in the tool cache, and
          # without this tar archives the link itself — a 4KB tarball holding
          # one dangling entry, which extracts fine and contains no java. The
          # installer then correctly reports no JRE, and the fixture gets the
          # blame it deserves only if we check for it.
          tar czhf /tmp/deps/OpenJDK21U-jre_x64_linux_hotspot.tar.gz \
            -C "$(dirname "$JAVA_HOME")" "$(basename "$JAVA_HOME")"
          cp "$(command -v ffmpeg)" "$(command -v ffprobe)" /tmp/deps/ffmpeg-release-amd64-static/
          tar cJf /tmp/deps/ffmpeg-release-amd64-static.tar.xz \
            -C /tmp/deps ffmpeg-release-amd64-static
          rm -rf /tmp/deps/ffmpeg-release-amd64-static

          # A fixture that is silently wrong tests nothing, and reads as a bug
          # in the thing under test.
          tar tzf /tmp/deps/OpenJDK21U-jre_x64_linux_hotspot.tar.gz | grep -q 'bin/java$' \
            || { echo "fixture is broken: the JRE archive has no bin/java" >&2; exit 1; }
          tar tJf /tmp/deps/ffmpeg-release-amd64-static.tar.xz | grep -q 'ffprobe$' \
            || { echo "fixture is broken: the ffmpeg archive has no ffprobe" >&2; exit 1; }

          cp /tmp/deps/* /tmp/unpack/dependencies/

          echo "--- the dry run reports what it found, and installs nothing ---"
          /tmp/unpack/install.sh --check
          test ! -d /opt/camstream

          echo "--- an empty dependencies directory is refused, with instructions ---"
          mkdir -p /tmp/bare && tar -xzf dist/camstream-agent-*-linux.tar.gz -C /tmp/bare
          if /tmp/bare/install.sh --check 2>/tmp/bare.err; then
            echo "an empty bundle should not have passed" >&2; exit 1
          fi
          grep -q "dependencies/ directory is empty" /tmp/bare.err

          sudo /tmp/unpack/install.sh /tmp/agent.yaml

      - name: Verify what the installer produced
        run: |
          set -e
          echo "--- unit file is valid ---"
          systemd-analyze verify /etc/systemd/system/camstream-agent.service
          echo "--- service is enabled ---"
          systemctl is-enabled camstream-agent
          echo "--- runs as an unprivileged user ---"
          id camstream
          echo "--- permissions ---"
          # sudo, because /etc/camstream is 0750 root:camstream and the runner
          # is not in that group — which is the point of it.
          sudo stat -c '%a %U:%G %n' \
            /etc/camstream /etc/camstream/agent.yaml /var/lib/camstream /opt/camstream/camstream-agent.jar
          test "$(sudo stat -c '%a' /etc/camstream/agent.yaml)" = "640"
          test "$(sudo stat -c '%a' /var/lib/camstream)" = "700"
          test "$(sudo stat -c '%U' /var/lib/camstream)" = "camstream"
          # The config holds camera credentials: readable by the service, not by
          # ordinary users on the box.
          sudo -u nobody cat /etc/camstream/agent.yaml 2>/dev/null \
            && { echo "config is world-readable" >&2; exit 1; } || echo "config is not readable by others"

          echo "--- the agent runs the bundled runtime, not anything on PATH ---"
          sudo grep -E '^ExecStart=' /etc/systemd/system/camstream-agent.service
          sudo grep -qE '^ExecStart=/opt/camstream/runtime/' /etc/systemd/system/camstream-agent.service
          # ffmpeg and ffprobe are named absolutely in the config, so a system
          # upgrade cannot change which binaries the service runs.
          sudo grep -qE '^ffmpegPath: /opt/camstream/runtime/' /etc/camstream/agent.yaml
          sudo grep -qE '^ffprobePath: /opt/camstream/runtime/' /etc/camstream/agent.yaml
          test -x "$(sudo sed -n 's/^ffmpegPath: //p' /etc/camstream/agent.yaml)"

      # It cannot connect — there is no certificate and the endpoints are
      # invalid — but it must fail by reporting that, not by hanging or by
      # dying before it has read its configuration.
      - name: Service fails loudly rather than silently
        run: |
          sleep 8
          sudo journalctl -u camstream-agent --no-pager -n 30 | tee /tmp/log.txt
          grep -qiE "certificate|TLS context|No such file" /tmp/log.txt \
            || { echo "expected a certificate-related failure; got the above" >&2; exit 1; }

      # A camera outage must not become an agent outage, so the unit restarts
      # indefinitely. Proving that needs the service to have failed at least
      # twice, which only the journal can show.
      - name: Service restarts after failing
        run: |
          sleep 15
          restarts="$(sudo journalctl -u camstream-agent --no-pager | grep -c 'Started camstream-agent')"
          echo "starts observed: $restarts"
          [ "$restarts" -ge 2 ] || { echo "expected the unit to restart" >&2; exit 1; }

      - name: Uninstall cleanly
        run: |
          sudo /tmp/unpack/uninstall.sh --purge
          ! systemctl is-enabled camstream-agent 2>/dev/null
          ! test -d /opt/camstream
          ! test -d /etc/camstream
          echo "removed"

  cloud:
    name: Cloud and web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Infrastructure
        working-directory: infra
        run: |
          npm ci --no-fund --no-audit
          # Both projects: the root tsconfig excludes lambda/, so this alone
          # checked the CDK app and nothing that actually runs in production.
          # An undefined identifier reached a deploy that way.
          npm run typecheck
          npm test --if-present
          # Synth needs an account; the value is irrelevant when not deploying.
          CDK_DEFAULT_ACCOUNT=000000000000 npx cdk synth --quiet

      - name: Web
        working-directory: web
        run: |
          npm ci --no-fund --no-audit
          # The repo carries an oxlint config that nothing ran, so the lint
          # rules were advisory at best.
          npm run lint
          npm run build

      # Dependencies were installed with --no-audit and never checked anywhere
      # else either, so a known-vulnerable transitive dependency would have
      # arrived silently. Advisory rather than blocking: a high-severity
      # finding in a dev-only tool should not stop a deploy at 2am, but nobody
      # should have to go looking for it.
      - name: Known vulnerabilities
        continue-on-error: true
        run: |
          echo "--- infra ---"; (cd infra && npm audit --audit-level=high)
          echo "--- web ---";   (cd web   && npm audit --audit-level=high)

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the agent
        working-directory: agent
        run: mvn -B --no-transfer-progress package -DskipTests

      # install.ps1 had never been executed by anything. It is the supported
      # path for a platform the product explicitly ships to, and it carries the
      # ARM64 JVM guard that is the difference between a clear refusal and an
      # UnsatisfiedLinkError at first start.
      - name: Install as a scheduled task
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-test | Out-Null
          Copy-Item agent/target/camstream-agent.jar dist-test/
          Copy-Item packaging/windows/install.ps1 dist-test/
          Copy-Item packaging/windows/uninstall.ps1 dist-test/
          Copy-Item packaging/agent.yaml.example dist-test/agent.yaml.example
          @'
          tenantId: ci-tenant
          premisesId: ci-site
          deviceId: ci-agent
          region: ap-south-1
          bucket: example-bucket
          apiInvokeUrl: https://example.invalid
          iotDataEndpoint: example.invalid
          iotCredentialsEndpoint: example.invalid
          certificatePath: C:/ProgramData/CamStream/device.crt
          privateKeyPath: C:/ProgramData/CamStream/device.key
          discoveryEnabled: false
          cameras: []
          '@ | Set-Content -Path dist-test/agent.yaml -Encoding utf8

          ./dist-test/install.ps1 -ConfigPath ./dist-test/agent.yaml -UseScheduledTask -AllowSystemTools

      - name: Verify what the installer produced
        shell: pwsh
        run: |
          if (-not (Get-ScheduledTask -TaskName 'camstream-agent' -ErrorAction SilentlyContinue)) {
            throw 'the scheduled task was not registered'
          }
          if (-not (Test-Path "$env:ProgramData\CamStream\agent.yaml")) {
            throw 'the configuration was not installed'
          }
          # The config holds camera credentials, so its directory must not be
          # readable by ordinary users.
          $acl = Get-Acl "$env:ProgramData\CamStream"
          $acl.Access | ForEach-Object { "$($_.IdentityReference) $($_.FileSystemRights)" }
          if ($acl.Access | Where-Object { $_.IdentityReference -match 'Users|Everyone' }) {
            throw 'the data directory is readable by ordinary users'
          }

      - name: Uninstall cleanly
        shell: pwsh
        run: |
          ./dist-test/uninstall.ps1 -Purge
          if (Get-ScheduledTask -TaskName 'camstream-agent' -ErrorAction SilentlyContinue) {
            throw 'the scheduled task survived uninstall'
          }

  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the tree
        run: |
          set -e
          fail=0
          # Private keys of any kind, AWS access key ids, and the device
          # material that must never leave a customer's premises.
          # Anchored: a real PEM has the header alone on its own line, whereas
          # source that writes one has it inside a string literal.
          if git grep -nIE -- '^-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----$'; then
            echo "::error::a private key is committed"; fail=1
          fi
          if git grep -nIE 'AKIA[0-9A-Z]{16}'; then
            echo "::error::an AWS access key id is committed"; fail=1
          fi
          if git ls-files | grep -E '(^|/)devices/|\.p12$|identity\.json$'; then
            echo "::error::device identity material is committed"; fail=1
          fi
          exit $fail
